name: Desktop app
# デスクトップアプリ（macOS・Windows）のインストーラーを 1 つのジョブで作り、配布用の公開リポジトリ Peyangpiece/SaBoRo の Release に載せる。
# このリポジトリは非公開で、ログインしていない人には Release が 404 になるため、配布物だけを公開リポジトリに置く。
# 別のリポジトリに書き込むので、SaBoRo の Contents に書き込める個人アクセストークンを secrets.SABORO_RELEASE_TOKEN に入れておく。
# electron-builder の公開機能は使わない（配布物ごとに Release を作ろうとして同じ版の Release が複数できる）。
# 作った配布物を gh release create で 1 回でまとめて載せる（タグの作成・公開・最新版の指定まで一度に行う）。
# タグ desktop-v* を押すか、手動で実行する。アプリは Release の最新版を自動で確認して更新する。
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.SABORO_RELEASE_TOKEN }}
      DIST_REPO: Peyangpiece/SaBoRo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # 同じ版の作りかけ（下書き・配布物のない Release）が残っていれば消してから作る
      - name: Remove stale release for this version
        run: |
          gh api repos/$DIST_REPO/releases --paginate --jq '.[] | select(.tag_name=="${{ steps.version.outputs.tag }}") | .id' | while read -r id; do gh api -X DELETE "repos/$DIST_REPO/releases/$id"; done
          gh api -X DELETE "repos/$DIST_REPO/git/refs/tags/${{ steps.version.outputs.tag }}" 2>/dev/null || true
      # PDF の読み取り（pdf-parse）が使う @napi-rs/canvas は OS・CPU ごとに別のパッケージで、npm ci はこの Mac（Apple シリコン）用しか入れない。
      # 入っていないと Windows と Intel Mac で起動時に「DOMMatrix is not defined」になるため、配る分をすべて取り込む（版は package-lock.json に合わせる）
      - name: Add native canvas binaries for every target
        run: |
          for pkg in canvas-win32-x64-msvc canvas-darwin-x64 canvas-darwin-arm64; do
            dir="node_modules/@napi-rs/$pkg"
            [ -d "$dir" ] && continue
            ver=$(node -p "require('./package-lock.json').packages['node_modules/@napi-rs/$pkg'].version")
            mkdir -p "$dir"
            curl -fsSL "https://registry.npmjs.org/@napi-rs/$pkg/-/$pkg-$ver.tgz" | tar -xz -C "$dir" --strip-components=1
          done
          ls node_modules/@napi-rs/
      # Mac は ad-hoc 署名（package.json の mac.identity: "-"）。署名がないと Apple シリコンでは「壊れているため開けません」になる
      - name: Build (macOS + Windows)
        run: npx electron-builder --mac --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # ホームページのダウンロードボタンは版の番号を知らないので、版の番号のない名前の複製も載せる
      # （https://github.com/Peyangpiece/SaBoRo/releases/latest/download/saboro-mac-arm64.dmg などで常に最新版を指せる）
      - name: Create the release with every installer
        run: |
          v="${{ steps.version.outputs.tag }}"; v="${v#v}"
          cp "release/saboro-$v-mac-arm64.dmg" release/saboro-mac-arm64.dmg
          cp "release/saboro-$v-mac-x64.dmg" release/saboro-mac-x64.dmg
          cp "release/saboro-$v-win-x64.exe" release/saboro-win-x64.exe
          ls -la release
          gh release create "${{ steps.version.outputs.tag }}" --repo "$DIST_REPO" --latest --title "saboro ${{ steps.version.outputs.tag }}" --notes "Mac は .dmg（Apple シリコンは arm64、Intel は x64）、Windows は .exe を入れてください。Apple の署名がないため、Mac は初回に開こうとして止められたあと「システム設定 → プライバシーとセキュリティ」の「このまま開く」、Windows は SmartScreen の「詳細情報 → 実行」が必要です。" release/*.dmg release/*.zip release/*.blockmap release/*.exe release/latest*.yml
