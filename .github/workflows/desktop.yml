name: Desktop app
# デスクトップアプリ（macOS・Windows）のインストーラーを 1 つのジョブで作り、GitHub Release（公開）に載せる。
# 2 つのジョブに分けると Release の下書きが 2 つできてしまうため、macOS の環境で両方を作る（Windows 向けは NSIS で作れる）。
# タグ desktop-v* を押すか、手動で実行する。アプリは Release の最新版を自動で確認して更新する。
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and publish (macOS + Windows)
        run: npx electron-builder --mac --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
