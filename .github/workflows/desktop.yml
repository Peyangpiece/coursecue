name: Desktop app
# デスクトップアプリ（macOS・Windows）のインストーラーを 1 つのジョブで作り、GitHub Release に載せて公開する。
# electron-builder は Release を下書きとして作る（公開済みとして作ろうとすると、タグがまだないため 422 になる）。
# 配布物が揃ってから gh で下書きを公開し、最新版にする。
# タグ desktop-v* を押すか、手動で実行する。アプリは Release の最新版を自動で確認して更新する。
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # 同じ版の作りかけ（下書き・配布物のない Release）が残っていれば消してから作る
      - name: Remove stale release for this version
        run: |
          gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.tag_name=="${{ steps.version.outputs.tag }}") | .id' | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id"; done
          git push --delete origin "${{ steps.version.outputs.tag }}" 2>/dev/null || true
      - name: Build and upload (macOS + Windows)
        run: npx electron-builder --mac --win --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish the release
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --latest --title "saboro ${{ steps.version.outputs.tag }}" --notes "Mac は .dmg（Apple シリコンは arm64、Intel は x64）、Windows は .exe を入れてください。署名していないため、Mac は初回に右クリック → 開く、Windows は SmartScreen の「詳細情報 → 実行」が必要です。"
