name: Test and deploy
# main に入った変更をテストし、成功したら Cloudflare に公開する。
# 公開に成功したコミットを deployed ブランチに記録し、Mac サービスはそこまで自動更新する。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # deployed ブランチを早送りで進めるには履歴が必要（既定の1件だけでは push が拒否される）
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 公開したコミットを Worker に持たせる。Mac は処理の確認（5秒ごと）のついでにこれを見て、違えばすぐ更新する
      - run: npx wrangler deploy --var DEPLOYED_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Record deployed commit
        run: git push origin HEAD:refs/heads/deployed
