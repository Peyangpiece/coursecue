name: Test and deploy
# main に入った変更をテストし、成功したら Cloudflare に公開する。
# 公開に成功したコミットを deployed ブランチに記録し、Mac サービスはそこまで自動更新する。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright のブラウザは版ごとにキャッシュして、毎回のダウンロードを省く
      - id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # deployed ブランチを早送りで進めるには履歴が必要（既定の1件だけでは push が拒否される）
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # 公開したコミットを Worker に持たせる。Mac は処理の確認（5秒ごと）のついでにこれを見て、違えばすぐ更新する
      # D1 の表を用意する（IF NOT EXISTS だけなので何度実行しても同じ）
      - run: npx wrangler d1 execute coursecue-private --remote --file server/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 管理者画面（/admin.html）の秘密。GitHub の Secrets に ADMIN_TOKEN（32 文字以上）があれば Worker の秘密に入れる（なければ何もしない）
      - run: if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN; fi
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Stripe の通知の署名シークレット（whsec_…）。GitHub の Secrets に STRIPE_WEBHOOK_SECRET があれば Worker の秘密に入れる
      - run: if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET; fi
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # SaBoRo の AI：SaBoRo 専用の Anthropic の API キー（sk-ant-…。GitHub の Secrets の SABORO_ANTHROPIC_API_KEY）と、超過分を請求する Stripe の制限付きキー（rk_…。請求項目・請求書の書き込みだけ）
      # GitHub Action（@claude）用の ANTHROPIC_API_KEY とは分ける（費用・上限を別にするため）。以前の版が Worker に入れた ANTHROPIC_API_KEY は使わないので消す（なければ何もしない）
      - run: |
          if [ -n "$SABORO_ANTHROPIC_API_KEY" ]; then printf '%s' "$SABORO_ANTHROPIC_API_KEY" | npx wrangler secret put SABORO_ANTHROPIC_API_KEY; fi
          npx wrangler secret delete ANTHROPIC_API_KEY >/dev/null 2>&1 || true
        env:
          SABORO_ANTHROPIC_API_KEY: ${{ secrets.SABORO_ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: if [ -n "$STRIPE_API_KEY" ]; then printf '%s' "$STRIPE_API_KEY" | npx wrangler secret put STRIPE_API_KEY; fi
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy --var DEPLOYED_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Record deployed commit
        run: git push origin HEAD:refs/heads/deployed
      # ホームページ（サービスの説明・特定商取引法に基づく表記・規約）。アプリとは別の公開先（site/wrangler.jsonc の saboro-site）
      # アプリの公開と記録の後に行う（ホームページの失敗でアプリの更新を止めない）
      - name: Deploy homepage
        run: npx wrangler deploy --config site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
