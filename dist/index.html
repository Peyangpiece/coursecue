const courses=['人材マネジメントⅡ','コーポレートファイナンスⅡ','国際ビジネス戦略','サービス・マーケティング','意思決定論','管理会計Ⅱ','マーケティング戦略','ボランティア','経営科学Ⅱ','経済言論Ⅱ','言葉と文化'];
const tasks=[{id:1,course:0,round:3,title:'OJT・OFF-JTについての振り返り',status:'wait',action:'学習・研修の経験を入力',due:'10/12（月）23:55',urgency:'あと2日',type:'レポート',description:'アルバイトでのOJT、授業外の学習や研修、今後高めたい能力について振り返る課題です。',answer:'学習・研修についての経験を入力してください。'},{id:2,course:1,round:3,title:'資本コストと企業価値',status:'code',action:'manaboで出席コードを選択',due:'10/15（木）23:59',urgency:'あと5日',type:'クイズ',description:'講義資料を参照して問題の回答を選択するクイズです。出席コードが必要なため、提出前で待機しています。',answer:'問題の回答選択まで完了した想定のプレビューです。実際のクイズ回答・送信は行っていません。'},{id:3,course:2,round:2,title:'新興国への事業進出',status:'draft',action:'下書きを確認・提出',due:'10/12（月）24:00',urgency:'あと2日',type:'レポート',description:'新興国への事業進出について、講義内容をもとに200〜300字で考察します。',answer:'講義で扱った事例から、現地の需要、社会的な影響、長期的な事業継続性を検討します。この回答は画面確認用のサンプルです。'},{id:4,course:5,round:2,title:'管理会計の基礎確認',status:'ready',action:'回答を確認',due:'10/11（日）23:59',urgency:'明日まで',type:'クイズ',description:'授業で扱った管理会計の基礎に関する確認問題です。',answer:'サンプル資料を参照して回答を確認する画面です。'},{id:5,course:3,round:2,title:'サービスの特徴と価値',status:'done',due:'10/09（金）23:59',urgency:'提出確認済み',type:'レポート',description:'サービスの特徴について考察する課題です。',answer:'提出済み回答のサンプルです。'},{id:6,course:4,round:2,title:'意思決定と個人の経験',status:'draft',action:'経験・回答を確認',due:'10/10（土）23:59',urgency:'今日まで',type:'レポート',description:'知識・知覚・記憶と意思決定の関係を、個人の経験から考察します。',answer:'自分で経験した出来事を入力して、下書きを完成させましょう。'}];
const statuses={wait:['本人の確認待ち','wait'],code:['出席コード待ち','wait'],draft:['下書き作成済み','draft'],ready:['回答確認中',''],done:['提出確認済み','done']};let view='home',filter='all',query='',selectedCourse=null,lastFocus=null;let saved={};try{saved=JSON.parse(localStorage.getItem('coursecue-demo')||'{}')}catch{};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',4000)}
function nav(){document.querySelector('.nav').innerHTML=[['home','home','ホーム'],['courses','book','授業一覧'],['tasks','check','課題一覧'],['needs','clock','要対応'],['settings','settings','設定']].map(([v,i,l])=>`<button data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${ic(i)}${l}${v==='needs'?'<span class="count">2</span>':''}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;filter='all';selectedCourse=null;render();window.scrollTo(0,0)})}
function taskrow(t){const [label,cl]=statuses[t.status];return `<div class="task" role="button" tabindex="0" data-task="${t.id}" aria-label="${esc(t.title)}の詳細"><div class="courseicon ${t.status==='wait'||t.status==='code'?'amber':''}">${['人','財','国','サ','意','管'][t.course]||'学'}</div><div><h3>${esc(t.title)}</h3><div class="meta"><span>${courses[t.course]}</span><span>第${t.round}回</span><span>${t.type}</span></div>${['wait','code'].includes(t.status)?`<div class="rowaction">${t.action}</div>`:''}</div><div class="right"><span class="badge ${cl}">${label}</span><span class="deadline ${['今日まで','明日まで'].includes(t.urgency)?'urgent':''}">${t.status==='done'?'':t.due.replace(/（.*?）/,' ')}</span></div></div>`}
function matched(t){return(!query||(courses[t.course]+t.title).includes(query))&&(filter==='all'||filter==='pending'&&t.status!=='done'||filter==='done'&&t.status==='done'||filter==='soon'&&[1,3,4,6].includes(t.id))&&(selectedCourse===null||selectedCourse===t.course)}
function list(rows,tabs=true){return `${tabs?`<div class="tabs"><button class="tab ${filter==='all'?'active':''}" data-filter="all">すべて</button><button class="tab ${filter==='pending'?'active':''}" data-filter="pending">未提出</button><button class="tab ${filter==='done'?'active':''}" data-filter="done">提出済み</button><button class="tab ${filter==='soon'?'active':''}" data-filter="soon">3日以内</button></div>`:''}<div class="tasklist">${rows.filter(matched).map(taskrow).join('')||'<div class="empty">該当する課題はありません</div>'}</div>`}
function coursecards(all=false){return `<div class="coursegrid">${courses.map((c,i)=>({c,i})).filter(({c,i})=>(all||i<6)&&(!query||c.includes(query))).map(({c,i})=>{let ts=tasks.filter(t=>t.course===i),p=ts.filter(t=>t.status!=='done').length;return `<button class="coursecard" data-course="${i}"><div style="display:flex;align-items:center;justify-content:space-between"><div class="courseicon">${['人','財','国','サ','意','管','マ','ボ','科','経','文'][i]}</div><span style="color:#a6b19d">${ic('arrow')}</span></div><h3>${c}</h3><div class="bottom"><span>${ts.length} 件の課題</span><span style="color:${p?'var(--amber)':'var(--green)'}">${p?`未提出 ${p} 件`:'対応待ちなし'}</span></div></button>`}).join('')}</div>`}
function render(){nav();document.getElementById('breadcrumb').textContent={home:'ホーム',courses:'授業一覧',tasks:'課題一覧',needs:'要対応',settings:'設定'}[view];let html='';const refresh=`<button class="btn" id="refresh">${ic('refresh')}更新を確認</button>`;
if(view==='home'){html=`<section class="hero"><h1>ホーム</h1>${refresh}</section><section class="stats" aria-label="課題の状況"><button class="stat" data-stat="pending"><div class="label">未提出 ${ic('check')}</div><div class="num">5<span>件</span></div></button><button class="stat warn" data-stat="needs"><div class="label">要対応 ${ic('clock')}</div><div class="num">2<span>件</span></div></button><button class="stat" data-stat="soon"><div class="label">3日以内 ${ic('clock')}</div><div class="num">4<span>件</span></div></button><button class="stat" data-stat="done"><div class="label">提出済み ${ic('check')}</div><div class="num">1<span>件</span></div></button></section><section class="tasksection"><div class="sectionhead"><h2>未提出の課題</h2><small>締切順</small></div>${list([...tasks].filter(t=>t.status!=='done').sort((a,b)=>[6,4,1,3,2].indexOf(a.id)-[6,4,1,3,2].indexOf(b.id)),false)}</section><section class="courses"><div class="sectionhead"><h2>授業</h2><button class="tab" id="allcourses">すべて（11） →</button></div>${coursecards()}</section>`}
if(view==='courses'){html=`<section class="hero"><div><h1>${selectedCourse===null?'授業':courses[selectedCourse]}</h1>${selectedCourse!==null?'<button class="tab" id="backcourses">← 授業一覧</button>':''}</div>${refresh}</section>${selectedCourse===null?coursecards(true):list(tasks)}`}
if(view==='tasks'||view==='needs'){html=`<section class="hero"><h1>${view==='needs'?'要対応':'課題'}</h1>${refresh}</section>${list(view==='needs'?tasks.filter(t=>['wait','code'].includes(t.status)):tasks,view!=='needs')}`}
if(view==='settings'){html=`<section class="hero"><h1>設定</h1></section><div style="max-width:760px"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>manaboとの連携</b><div style="color:var(--muted);font-size:11px">中京大学 · 自動ログイン</div></div><span class="badge wait">未接続</span></div><div class="field"><label for="loginid">ログインID</label><input id="loginid" autocomplete="off" placeholder="大学のログインID"><small>認証情報は保存・送信されません。</small></div><div class="field"><label for="password">パスワード</label><input id="password" type="password" autocomplete="off" placeholder="実際のパスワードは入力しないでください"><small>キーチェーン連携は未実装。</small></div><button class="btn primary" id="connect">${ic('shield')}接続の流れを確認</button></div><div class="panel"><b>自動確認</b><div class="field"><label for="time">毎日の確認時刻</label><input id="time" type="time" value="${saved.time||'16:30'}"><small>日本時間</small></div><div class="toggleline"><span>要対応の通知</span><button class="toggle ${saved.notify===false?'':'on'}" role="switch" aria-label="対応通知" aria-checked="${saved.notify!==false}" id="toggle"></button></div><button class="btn primary" id="savesettings">プレビュー設定を保存</button></div><div class="panel"><b>提出のルール</b><div class="info-row"><span>通常のレポート</span>下書き作成まで</div><div class="info-row"><span>クイズ形式</span>資料を参照して回答・提出</div><div class="info-row"><span>出席コードが必要</span>問題を回答し、提出前で待機</div><div class="info-row"><span>回答の根拠が不足</span>あなたに確認</div></div></div>`}
document.getElementById('app').innerHTML=`<div class="view">${html}</div>`;document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{view=b.dataset.stat==='needs'?'needs':'tasks';filter=['pending','done','soon'].includes(b.dataset.stat)?b.dataset.stat:'all';query='';document.getElementById('search').value='';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-task]').forEach(b=>{b.onclick=()=>openTask(+b.dataset.task);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openTask(+b.dataset.task)}}});document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{selectedCourse=+b.dataset.course;view='courses';filter='all';render();window.scrollTo(0,0)});const bind=(id,f)=>{let e=document.getElementById(id);if(e)e.onclick=f};bind('refresh',()=>toast('UIプレビューです。manaboの実データ更新は未接続です。'));bind('allcourses',()=>{view='courses';render()});bind('backcourses',()=>{selectedCourse=null;render()});bind('connect',()=>{document.getElementById('loginid').value='';document.getElementById('password').value='';openConnection()});bind('toggle',()=>{let e=document.getElementById('toggle');e.classList.toggle('on');e.setAttribute('aria-checked',e.classList.contains('on'))});bind('savesettings',()=>{saved.time=document.getElementById('time').value;saved.notify=document.getElementById('toggle').classList.contains('on');persist();toast('プレビュー設定を保存しました。実際の16:30の自動確認は変更されません。')})}
function persist(){localStorage.setItem('coursecue-demo',JSON.stringify(saved))}function openDrawer(html){lastFocus=document.activeElement;document.getElementById('drawer').innerHTML=`<div class="drawerhead"><span>課題詳細</span><button class="iconbtn" id="close" aria-label="閉じる">${ic('close')}</button></div>${html}`;document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').onclick=close;document.getElementById('close').focus()}
function close(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';lastFocus?.focus()}
function openTask(id){const t=tasks.find(t=>t.id===id);openDrawer(`<h2 id="drawer-title">${t.title}</h2><span class="badge ${statuses[t.status][1]}">${statuses[t.status][0]}</span><div class="panel"><div class="info-row"><span>授業</span>${courses[t.course]}</div><div class="info-row"><span>講義回・形式</span>第${t.round}回 · ${t.type}</div><div class="info-row"><span>締切</span>${t.due}</div><div class="info-row"><span>情報の確認</span>サンプルデータ</div></div>${t.status!=='done'?`<div class="callout" style="margin-top:20px"><div class="tag">次にすること</div><p style="margin-top:10px;color:var(--ink)">${t.action}</p></div>`:''}<h3>課題の内容</h3><p style="font-size:12px;line-height:1.9;color:var(--muted)">${t.description}</p><h3>${t.status==='wait'?'あなたの経験・補足':'回答・下書き'}</h3><textarea id="answer" aria-label="回答・補足の編集" placeholder="経験や補足を入力">${esc(saved['answer'+id]||t.answer)}</textarea><small style="display:block;color:var(--muted);font-size:10px;margin-top:8px">保存先：このブラウザ</small><div class="actions"><button class="btn primary" id="saveanswer">${ic('check')}保存</button><button class="btn" id="download">${ic('file')}ダウンロード</button></div><h3>資料</h3><button class="btn" id="material">${ic('file')}第${t.round}回 講義資料</button><div class="panel"><b>履歴</b><p style="color:var(--muted);margin-bottom:0">${t.status==='done'?'サンプル：完了表示を確認 → 提出確認済み':'サンプル：課題を検出 → 回答の準備 → '+statuses[t.status][0]}</p></div><div class="actions"><a class="btn" href="https://manabo.cnc.chukyo-u.ac.jp/auth/shibboleth/" target="_blank" rel="noopener">manaboを開く ${ic('link')}</a></div>${t.status==='code'?'<p style="font-size:10px;color:var(--amber);line-height:1.9">出席コード待ち・未提出</p>':''}`);document.getElementById('saveanswer').onclick=()=>{saved['answer'+id]=document.getElementById('answer').value;persist();toast('保存しました。manaboには送信していません。')};document.getElementById('download').onclick=()=>{const blob=new Blob([`# ${courses[t.course]} 第${t.round}回\n\n${t.title}\n\n${document.getElementById('answer').value}\n\n※UIプレビューのサンプル。未提出。`],{type:'text/markdown;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`第${t.round}回_${t.title}_下書き.md`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('下書きをダウンロードしました。')};document.getElementById('material').onclick=()=>toast('資料は本番連携後に開けます。プレビューには実資料を含めていません。')}
function openConnection(){openDrawer('<h2 id="drawer-title">ログイン連携</h2><div class="panel"><div class="info-row"><span>01</span>ID・パスワードを設定画面で入力</div><div class="info-row"><span>02</span>パスワードをMacのキーチェーンへ保存</div><div class="info-row"><span>03</span>ログイン切れのときだけ自動ログイン</div><div class="info-row"><span>04</span>追加認証が必要ならあなたに通知</div></div><div class="callout" style="margin-top:20px"><p style="margin:0">接続機能は未実装。認証情報は保存・送信されません。</p></div>')}
document.getElementById('searchicon').innerHTML=ic('search');document.getElementById('bellicon').innerHTML=ic('bell');document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.getElementById('notifications').onclick=()=>{view='needs';filter='all';selectedCourse=null;render()};document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')close()};document.addEventListener('keydown',e=>{if(!document.getElementById('overlay').classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='Tab'){const focusable=[...document.getElementById('drawer').querySelectorAll('button,a,input,textarea,select,[tabindex="0"]')];let first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script><script type="module" src="./firebase-client.js"></script></body></html>
